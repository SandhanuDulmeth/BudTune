name: Build Linux and macOS previews
on:
  pull_request:
    paths: ['ui/**', 'src-tauri/**', 'build-desktop.ps1', '.github/workflows/desktop-preview.yml']
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact: BudTune-Linux-x64.tar.gz
          - runner: macos-15
            artifact: BudTune-macOS-arm64.zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libxkbcommon-dev libudev-dev \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - name: Update stable Rust
        run: rustup update stable --no-self-update
      - name: Build BudTune desktop app
        shell: pwsh
        env:
          RUSTUP_TOOLCHAIN: stable
        run: ./build-desktop.ps1 -TestProfiles -NoBundle:$IsLinux
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error
