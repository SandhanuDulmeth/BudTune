name: Build Linux and macOS previews
on:
  pull_request:
    paths: ['build-desktop.ps1', 'budtune*.patch', '.github/workflows/desktop-preview.yml']
  push:
    branches: [main]
    paths: ['build-desktop.ps1', 'budtune*.patch', '.github/workflows/desktop-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact: BudTune-Linux-x64.tar.gz
          - runner: macos-15
            artifact: BudTune-macOS-arm64.zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev libxkbcommon-dev libudev-dev
      - name: Verify target architecture
        shell: bash
        run: |
          case "$RUNNER_OS:$(uname -m)" in
            Linux:x86_64|macOS:arm64) ;;
            *) echo "Unexpected host architecture"; exit 1 ;;
          esac
      - name: Update stable Rust
        run: rustup update stable --no-self-update
      - name: Test device profiles and package
        shell: pwsh
        env:
          RUSTUP_TOOLCHAIN: stable
        run: ./build-desktop.ps1 -TestProfiles
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error
