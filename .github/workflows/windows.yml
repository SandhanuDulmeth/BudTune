name: Release Windows app
on:
  push:
    branches: [main]
    paths-ignore:
      - 'index.html'
      - 'sitemap.xml'
      - 'google*.html'
      - '**/*.md'
      - '.github/workflows/desktop-preview.yml'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      publish_signed:
        type: boolean
        default: false
        description: 'Request approval to sign and publish this Windows release'
permissions:
  contents: read
concurrency:
  group: budtune-windows-release
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 100
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable long paths
        run: git config --global core.longpaths true
      - name: Install stable Rust
        run: rustup update stable --no-self-update
      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-tauri-v0.3.0-${{ hashFiles('src-tauri/Cargo.toml', 'ui/package.json') }}
      - name: Build and test desktop app
        shell: pwsh
        env:
          RUSTUP_TOOLCHAIN: stable
        run: ./build-desktop.ps1 -TestProfiles
      - uses: actions/upload-artifact@v4
        id: windows-artifact
        with:
          name: BudTune-Windows-x64
          path: BudTune.exe
          if-no-files-found: error
      - name: Request approved Windows signing
        if: github.ref == 'refs/heads/main' && inputs.publish_signed == true
        uses: SignPath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_SLUG }}
          github-artifact-id: ${{ steps.windows-artifact.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: '2400'
          output-artifact-directory: signed
      - name: Publish the signed executable
        if: github.ref == 'refs/heads/main' && inputs.publish_signed == true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $file = 'signed/BudTune.exe'
          $signature = Get-AuthenticodeSignature $file
          if ($signature.Status -ne 'Valid') {
            throw "Windows signature failed verification: $($signature.Status)"
          }
          $tag = "v0.3.${{ github.run_number }}"
          $sha = (Get-FileHash $file).Hash
          $notes = "Free Windows x64 portable download. See CODE_SIGNING.md in the repository. Built from $env:GITHUB_SHA. SHA-256: $sha"
          gh release create $tag $file --latest --target $env:GITHUB_SHA --title "BudTune $tag for Windows" --notes $notes
          exit $LASTEXITCODE
