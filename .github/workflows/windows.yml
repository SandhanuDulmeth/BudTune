name: Release Windows app
on:
  push:
    branches: [main]
    paths-ignore:
      - 'index.html'
      - 'sitemap.xml'
      - 'google*.html'
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      publish_signed:
        type: boolean
        default: false
        description: 'Request approval to sign and publish this Windows release'
permissions:
  contents: read
concurrency:
  group: budtune-windows-release
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 100
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable long paths
        run: git config --global core.longpaths true
      - name: Install stable Rust
        run: rustup update stable --no-self-update
      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-tauri-v0.3.0-${{ hashFiles('src-tauri/Cargo.toml', 'ui/package.json') }}
      - name: Build and test desktop app
        shell: pwsh
        env:
          RUSTUP_TOOLCHAIN: stable
        run: ./build-desktop.ps1 -TestProfiles -NoBundle
      - uses: actions/upload-artifact@v4
        id: windows-artifact
        with:
          name: BudTune-Windows-x64
          path: BudTune.exe
          if-no-files-found: error
      - name: Request approved Windows signing
        if: github.ref == 'refs/heads/main' && inputs.publish_signed == true
        uses: SignPath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_SLUG }}
          github-artifact-id: ${{ steps.windows-artifact.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: '2400'
          output-artifact-directory: signed
      - name: Verify the Windows signature
        if: github.ref == 'refs/heads/main' && inputs.publish_signed == true
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature -LiteralPath 'signed/BudTune.exe'
          if ($signature.Status -ne 'Valid') {
            throw "Windows signature failed verification: $($signature.Status)"
          }
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && inputs.publish_signed == true
        with:
          name: BudTune-Windows-signed-x64
          path: signed/BudTune.exe
          if-no-files-found: error

  desktop:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish_signed == true)
    uses: ./.github/workflows/desktop-preview.yml

  publish:
    needs: [windows, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.publish_signed == true && 'BudTune-Windows-signed-x64' || 'BudTune-Windows-x64' }}
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: BudTune-Linux-x64.tar.gz
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: BudTune-macOS-arm64.zip
          path: release
      - name: Publish the desktop release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_SIGNED: ${{ inputs.publish_signed == true }}
        shell: bash
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
            echo 'A newer commit is on main. Skipping release publication for this build.'
            exit 0
          fi
          tag="v0.3.$GITHUB_RUN_NUMBER"
          files=(BudTune.exe BudTune-Linux-x64.tar.gz BudTune-macOS-arm64.zip)
          status='The Windows preview is unsigned and Windows Smart App Control may block it.'
          if [[ "$PUBLISH_SIGNED" == true ]]; then
            status='The Windows Authenticode signature was verified.'
          fi
          cd release
          {
            printf 'Windows x64, Linux x64, and Apple Silicon downloads.\n\n%s\n\n' "$status"
            printf '[Corresponding source](https://github.com/%s/tree/%s)\n\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            printf 'SHA-256 checksums\n\n'
            printf '%s\n' '```'
            sha256sum -- "${files[@]}"
            printf '%s\n' '```'
          } > "$RUNNER_TEMP/budtune-release-notes.md"
          gh release create "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" --latest \
            --target "$GITHUB_SHA" --title "BudTune $tag" --notes-file "$RUNNER_TEMP/budtune-release-notes.md"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  sourceforge:
    needs: publish
    if: needs.publish.outputs.tag != '' && vars.SOURCEFORGE_USERNAME != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download the published binaries
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.publish.outputs.tag }}
        run: |
          gh release download "$RELEASE_TAG" --dir release \
            --pattern BudTune.exe --pattern BudTune-Linux-x64.tar.gz --pattern BudTune-macOS-arm64.zip
      - name: Mirror binaries and set per-platform downloads
        env:
          RELEASE_TAG: ${{ needs.publish.outputs.tag }}
          SOURCEFORGE_USERNAME: ${{ vars.SOURCEFORGE_USERNAME }}
          SOURCEFORGE_SSH_KEY: ${{ secrets.SOURCEFORGE_SSH_KEY }}
          SOURCEFORGE_RELEASE_API_KEY: ${{ secrets.SOURCEFORGE_RELEASE_API_KEY }}
        run: bash .github/scripts/mirror-sourceforge.sh "$RELEASE_TAG" release
