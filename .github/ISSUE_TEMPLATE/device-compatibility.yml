name: Device compatibility
description: Report a Bluetooth issue or request support for an earbud model
title: '[Device]: '
body:
  - type: input
    id: model
    attributes:
      label: Marketing name and exact model code
      placeholder: Soundcore R50i, A3949
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Earbud firmware and BudTune version
  - type: input
    id: desktop
    attributes:
      label: OS, version, architecture and Bluetooth adapter
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What did you try and what happened?
      description: Include steps and expected behavior. Remove device addresses and serial numbers from logs.
    validations:
      required: true
