[package]
name = "budtune"
version = "0.3.0"
description = "Modern cross-platform Soundcore earbuds & headphones super app"
authors = ["BudTune Contributors"]
license = "GPL-3.0-or-later"
edition = "2024"

[lib]
name = "budtune_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
dirs = "6"
macaddr = "1"
strum = "0.28"
indexmap = "2"
openscq30-lib = { path = "../engine-src/lib", features = ["bundled-dependencies"] }
openscq30-i18n = { path = "../engine-src/i18n" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Devices_Bluetooth", "Devices_Enumeration", "Devices_Radios", "Foundation"] }
windows-collections = "0.3"

[profile.release]
strip = true
lto = "thin"
